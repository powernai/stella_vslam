# Builds cpms-stella-vslam-demo for the demo and duke RabbitMQ cutover (powernai/cpms#1483).
# Runs on every push to `demo-duke`. Pushes cpms-stella-vslam-demo:<short sha> and cpms-stella-vslam-demo:rmq-2026-11, never :latest:
# demo and duke's task definitions are pinned by digest, and the cutover picks this image up deliberately.
# rmq-2026-11 is set once; if it already points at a different image the job fails instead of moving it
# (the :<short sha> image is still pushed).
name: Build cpms-stella-vslam-demo (rmq cutover)

on:
  push:
    branches: ["demo-duke"]

concurrency:
  group: build-cpms-stella-vslam-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 237438432579.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: cpms-stella-vslam-demo
  CUTOVER_TAG: rmq-2026-11

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Short sha
        id: meta
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push :<short sha>
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.desktop
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.short }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Check the image has the broker TLS change
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          found=$(docker run --rm --platform linux/amd64 --entrypoint sh "$IMAGE" -c \
            "find / -xdev -name 'basicClient.py' -not -path '/proc/*' -not -path '*/node_modules/*' -not -path '/usr/lib/*' \
               2>/dev/null | xargs -r grep -l AMQP_CA_CERT 2>/dev/null" || true)
          if [ -z "$found" ]; then
            echo "::error::no basicClient.py mentioning AMQP_CA_CERT in $IMAGE"
            exit 1
          fi
          echo "found: $found"

      - name: Tag ${{ env.CUTOVER_TAG }} (only if unset or already this image)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          existing=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$CUTOVER_TAG" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "None" ] && [ "$existing" != "$DIGEST" ]; then
            echo "::error::$ECR_REPOSITORY:$CUTOVER_TAG already points at $existing; not moving it. This build is :${GITHUB_SHA::8} ($DIGEST). Move the tag by hand only if the cutover should use this build."
            exit 1
          fi
          if [ "$existing" != "$DIGEST" ]; then
            manifest=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids imageDigest="$DIGEST" \
              --query 'images[0].imageManifest' --output text)
            mtype=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids imageDigest="$DIGEST" \
              --query 'images[0].imageManifestMediaType' --output text)
            aws ecr put-image --repository-name "$ECR_REPOSITORY" --image-tag "$CUTOVER_TAG" \
              --image-manifest "$manifest" --image-manifest-media-type "$mtype" > /dev/null
          fi

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $ECR_REPOSITORY"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- tags: \`:${GITHUB_SHA::8}\`, \`:$CUTOVER_TAG\`"
            echo "- digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
